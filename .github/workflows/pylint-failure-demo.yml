name: Pylint Failure Demonstration

on:
  push:
    branches:
      - test/pylint-failure

permissions:
  contents: read

jobs:
  pylint-failure-demo:
    name: Pylint Quality Gate - Failure Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pylint
        run: python -m pip install pylint

      - name: Run Pylint threshold check
        run: python -m pylint --fail-under=9.0 pylint_demo.py