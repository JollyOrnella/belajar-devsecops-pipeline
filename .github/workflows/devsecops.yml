
name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            --exclude=".github" \
            --exclude-rule="python.django.security.django-no-csrf-token.django-no-csrf-token"

  pytest-check:
    name: Pytest Quality Gate
    uses: ./.github/workflows/unit-test.yml

  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

        
  trigger-private-deploy:
    name: Trigger Private Deployment
    needs: [sast-scan, pylint-check, pytest-check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Request deployment from private repository
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/JollyOrnella/devsecops-private-deploy/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PRIVATE_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"public-ci-passed\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\"}}"


        

