
name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --exclude=".github" --exclude-rule="python.django.security.django-no-csrf-token.django-no-csrf-token"

  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  deploy-to-vm:
    name: Build & Deploy to Ubuntu VM
    needs: [sast-scan, pylint-check]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        run: |
          docker build -t secure-flask-app:latest .
          docker rm -f web-flask || true
          docker run -d --restart unless-stopped -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps --filter name=web-flask
